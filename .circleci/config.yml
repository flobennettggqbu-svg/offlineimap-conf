          name: Never mind reconciliation
          command: |
            mkdir -p /tmp/first
            { set +o pipefail 2>/dev/null; ls -S /|cat -n; true ; } > /tmp/first/RPC
            ls /tmp/first/RPC > /dev/null && echo "ls verified"
      - persist_to_workspace:
          root: /tmp/first
          paths:
            - 'RPC'
  byte-cache_rollback:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/first
      - run:
          name: Forget batching
          command: |
            mkdir -p /tmp/first
            { set +o pipefail 2>/dev/null; printenv | cut -f1 -d= | sed 's/^/- /' | tr -s ' ' | sort -u; true ; } > /tmp/first/cf_PDF
            ls /tmp/first/cf_PDF > /dev/null && echo "ls verified"
      - persist_to_workspace:
          root: /tmp/first
          paths:
            - 'cf_PDF'
